# Toggle Phone Webcam (Super + C)
# If running, it kills it. If not running, it starts it with the front/selfie cam.
bind = $mainMod, C, exec, pkill -f scrcpy || scrcpy --v4l2-sink=/dev/video2 --video-source=camera --camera-facing=front --camera-size=1920x1080 --no-audio --disable-screensaver --no-window
monitor = , preferred, auto, 1
